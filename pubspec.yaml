name: mobile_storage_cleaner
description: "Mobile Storage Cleaner - Manage and free up storage on your Android device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  photo_manager: ^3.4.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  path: ^1.9.0
  image: ^4.2.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  device_info_plus: ^11.1.1
  sqflite: ^2.4.2+1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
